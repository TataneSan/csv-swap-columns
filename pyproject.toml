[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-swap-columns"
version = "1.0.0"
description = "Swap or reorder CSV columns by name or index"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TataneSan" }]
keywords = ["csv", "columns", "reorder", "swap", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
csv-swap-columns = "csv_swap_columns.cli:main"

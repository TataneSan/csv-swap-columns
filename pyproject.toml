[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-swap-columns"
version = "1.0.0"
description = "Swap two columns of a CSV by name or 1-based index"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
csv-swap-columns = "csv_swap_columns.cli:main"

[tool.setuptools.packages.find]
include = ["csv_swap_columns*"]
